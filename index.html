<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aryan Sharma Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Aryan Sharma: aerodynamics, CFD/FEA and CAD work, competitions and achievements.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
/* Layout: fixed instrument-panel sidebar on the left, single routed view on the right over a faint solver-viewport grid. */
:root {
  /* dark-first: wind-tunnel ink + probe amber + solver cyan */
  --bg: #0A0E14;
  --surface: #111823;
  --surface-2: #17202D;
  --line: #233042;
  --grid: rgba(120, 150, 190, 0.06);
  --fg: #E6EBF2;
  --muted: #8E9BAE;
  --accent: #FFB547;
  --accent-ink: #1A1206;
  --accent-2: #5CC8E6;
  --accent-soft: rgba(255, 181, 71, 0.12);
  --accent-2-soft: rgba(92, 200, 230, 0.12);
  --media: #0C121B;
  --shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.8);
  --jet: linear-gradient(90deg, #1B2BD9 0%, #1E8BF0 18%, #22D3D8 36%, #3BE07A 52%, #E6E23A 68%, #F58A1F 84%, #D62318 100%);

  --font-display: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.2rem;
  --step-4: clamp(2.4rem, 4.5vw, 3.4rem);
  --radius: 4px;
  --sidebar: 300px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #EEF1F5; --surface: #FFFFFF; --surface-2: #F5F7FA; --line: #D5DCE5; --grid: rgba(40, 70, 110, 0.07);
    --fg: #121A26; --muted: #556275; --accent: #B4690E; --accent-ink: #FFFFFF; --accent-2: #0C7A98;
    --accent-soft: rgba(180, 105, 14, 0.10); --accent-2-soft: rgba(12, 122, 152, 0.10); --media: #E4E9F0;
    --shadow: 0 18px 40px -26px rgba(20, 40, 70, 0.35); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #EEF1F5; --surface: #FFFFFF; --surface-2: #F5F7FA; --line: #D5DCE5; --grid: rgba(40, 70, 110, 0.07);
  --fg: #121A26; --muted: #556275; --accent: #B4690E; --accent-ink: #FFFFFF; --accent-2: #0C7A98;
  --accent-soft: rgba(180, 105, 14, 0.10); --accent-2-soft: rgba(12, 122, 152, 0.10); --media: #E4E9F0;
  --shadow: 0 18px 40px -26px rgba(20, 40, 70, 0.35); color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-2); text-underline-offset: 3px; }
a:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; }
.mono { font-family: var(--font-mono); }
.label {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}

/* ---------- shell ---------- */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar);
  padding: calc(2.5rem + env(safe-area-inset-top, 0px)) 1.75rem calc(1.75rem + env(safe-area-inset-bottom, 0px)) max(1.75rem, env(safe-area-inset-left, 0px));
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 2rem; z-index: 20; overflow-y: auto;
}
.id-block { display: flex; flex-direction: column; gap: 1rem; }
.monogram {
  width: 76px; height: 76px; display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--accent-2-soft), transparent 70%), var(--surface-2);
  font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; letter-spacing: 0.04em; color: var(--fg);
  position: relative;
}
.monogram::after {
  content: ""; position: absolute; inset: -5px; border-radius: 50%;
  border: 2px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent-2);
  transform: rotate(-30deg);
}
.id-block h1 { font-size: var(--step-3); letter-spacing: 0.01em; }
.role-line { font-family: var(--font-mono); font-size: var(--step--1); color: var(--accent); }

/* colour legend: the signature element */
.legend { display: grid; gap: 6px; }
.legend-bar {
  height: 10px; background: var(--jet); border-radius: 2px;
  transform-origin: left center; animation: sweep 1.1s cubic-bezier(.2,.7,.2,1) both;
}
.legend-ticks { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.66rem; color: var(--muted); }
.legend-title { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); }
@keyframes sweep { from { transform: scaleX(0.04); } to { transform: scaleX(1); } }

.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav a {
  display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
  padding: 0.6rem 0.85rem; border-left: 2px solid transparent; border-radius: 0 var(--radius) var(--radius) 0;
  font-family: var(--font-display); font-size: 1.2rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); text-decoration: none; transition: color .25s, background-color .25s, border-color .25s;
}
.nav a .count { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0; color: var(--muted); }
.nav a:hover { color: var(--fg); background: var(--accent-2-soft); border-left-color: var(--accent-2); }
.nav a[aria-current="page"] { color: var(--fg); background: var(--accent-soft); border-left-color: var(--accent); }

.side-foot { display: grid; gap: 0.75rem; }
.side-foot .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.theme-btn {
  font: inherit; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
  background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0.4rem 0.7rem; cursor: pointer;
}
.theme-btn:hover { color: var(--fg); border-color: var(--accent-2); }

.main {
  flex: 1; margin-left: var(--sidebar); min-width: 0;
  padding-block: calc(3.5rem + env(safe-area-inset-top, 0px)) 5rem;
  padding-left: max(3.5rem, env(safe-area-inset-left, 0px));
  padding-right: max(3.5rem, env(safe-area-inset-right, 0px));
}
.view { max-width: 1080px; transition: opacity .3s ease, transform .3s ease; }
.view.leaving { opacity: 0; transform: translateY(10px); }

/* ---------- section heads ---------- */
.head { display: grid; gap: 0.6rem; margin-bottom: 2.25rem; }
.head h2 { font-size: var(--step-4); letter-spacing: 0.01em; }
.head p { color: var(--muted); max-width: 62ch; }
.rule { height: 2px; width: 120px; background: var(--jet); border-radius: 2px; }

/* ---------- about ---------- */
.about-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 3rem; align-items: start; }
.lede { font-family: var(--font-display); font-size: var(--step-2); font-weight: 500; line-height: 1.3; max-width: 30ch; }
.lede em { font-style: normal; color: var(--accent); }
.prose { display: grid; gap: 1.1rem; max-width: 64ch; color: var(--fg); }
.prose p { color: var(--muted); }
.prose strong { color: var(--fg); font-weight: 600; }

.spec { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.spec-title { padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.spec dl { margin: 0; display: grid; grid-template-columns: auto 1fr; }
.spec dt, .spec dd { padding: 0.65rem 1rem; border-bottom: 1px solid var(--line); margin: 0; }
.spec dt { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
.spec dd { font-size: 0.95rem; min-width: 0; }
.spec dl > :nth-last-child(-n+2) { border-bottom: 0; }

.highlights { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin-top: 3rem; }
.hl { border-top: 2px solid var(--line); padding-top: 1rem; display: grid; gap: 0.35rem; }
.hl:nth-child(1) { border-top-color: var(--accent); }
.hl:nth-child(2) { border-top-color: var(--accent-2); }
.hl b { font-family: var(--font-display); font-size: var(--step-2); font-weight: 600; line-height: 1.1; }
.hl span { color: var(--muted); font-size: 0.92rem; }

.sub { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin: 3.5rem 0 1.25rem; }
.sub h3 { font-size: var(--step-2); }

/* ---------- buttons, chips ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; text-decoration: none;
  font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 0.65rem 1rem; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--fg); transition: border-color .2s, background-color .2s, color .2s;
}
.btn:hover { border-color: var(--accent); color: var(--fg); background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); color: var(--accent-ink); }

.filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
.filter {
  font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.04em; cursor: pointer;
  padding: 0.45rem 0.85rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
}
.filter:hover { color: var(--fg); border-color: var(--accent-2); }
.filter[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.filter .n { opacity: 0.7; margin-left: 0.35rem; }

.tag {
  display: inline-block; font-family: var(--font-mono); font-size: 0.74rem; padding: 0.25rem 0.55rem;
  border-radius: var(--radius); background: var(--accent-2-soft); color: var(--fg); border: 1px solid transparent;
}
.tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }

/* ---------- project cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.25rem; }
.card {
  display: flex; flex-direction: column; text-align: left; cursor: pointer; padding: 0; min-width: 0;
  font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow); }
.card-media { position: relative; aspect-ratio: 16 / 10; background: var(--media); border-bottom: 1px solid var(--line); overflow: hidden; max-width: 100%; }
.card-media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
.card-media img.contain { object-fit: contain; padding: 1.25rem; }
.card:hover .card-media img { transform: scale(1.03); }
.badges { position: absolute; top: 0.6rem; left: 0.6rem; right: 0.6rem; display: flex; gap: 0.35rem; flex-wrap: wrap; }
.badge {
  font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.04em; padding: 0.2rem 0.5rem; border-radius: var(--radius);
  background: rgba(10, 14, 20, 0.78); color: #E6EBF2; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.badge.hot { background: var(--accent); color: var(--accent-ink); }
.card-body { padding: 1.1rem 1.15rem 1.25rem; display: flex; flex-direction: column; gap: 0.55rem; flex: 1; }
.card-body h3 { font-size: 1.35rem; }
.card-body p { color: var(--muted); font-size: 0.93rem; }
.card-foot { margin-top: auto; padding-top: 0.6rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
.card-foot .label { color: var(--accent-2); }

/* no-image placeholder: drawn mesh */
.placeholder { position: absolute; inset: 0; display: grid; place-items: center; }
.placeholder canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.placeholder span { position: relative; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); background: var(--surface); padding: 0.25rem 0.55rem; border: 1px solid var(--line); border-radius: var(--radius); }
.award-plate { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 1.5rem; }
.award-plate b { font-family: var(--font-display); font-size: 2.6rem; line-height: 1; color: var(--accent); }
.award-plate small { display: block; margin-top: 0.4rem; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

/* ---------- detail ---------- */
.back { margin-bottom: 2rem; }
.detail-head { display: grid; gap: 0.9rem; margin-bottom: 2rem; }
.detail-head h2 { font-size: var(--step-4); }
.meta { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.meta .badge { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.meta .badge.hot { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.gallery { position: relative; margin-bottom: 2.5rem; }
.track {
  display: flex; gap: 1rem; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--media); padding: 1rem; scrollbar-width: thin;
}
.slide { flex: 0 0 100%; scroll-snap-align: center; margin: 0; display: grid; gap: 0.6rem; }
.slide img { width: 100%; height: clamp(240px, 52vh, 520px); object-fit: contain; display: block; border-radius: 2px; }
.slide figcaption { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); display: flex; gap: 0.75rem; }
.slide figcaption b { color: var(--accent); font-weight: 500; }
.gal-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 0.75rem; gap: 1rem; }
.gal-nav .btns { display: flex; gap: 0.5rem; }
.gal-nav .btn { padding: 0.5rem 0.85rem; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots i { width: 18px; height: 3px; background: var(--line); border-radius: 2px; }
.dots i.on { background: var(--accent); }
.empty-visual { position: relative; height: 260px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--media); margin-bottom: 2.5rem; overflow: hidden; }

.detail-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 2.5rem; align-items: start; }
.detail-grid .prose p { color: var(--fg); }
.block { display: grid; gap: 0.75rem; }
.block + .block { margin-top: 2rem; }
.role-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.55rem; }
.role-list li { position: relative; padding-left: 1.25rem; color: var(--fg); }
.role-list li::before { content: ""; position: absolute; left: 0; top: 0.7em; width: 8px; height: 2px; background: var(--accent); }
.spec-mini { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.spec-mini div { display: grid; grid-template-columns: 9.5rem 1fr; gap: 0.75rem; padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
.spec-mini div:last-child { border-bottom: 0; }
.spec-mini dt { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding-top: 0.15rem; }
.spec-mini dd { margin: 0; min-width: 0; }
.note { font-size: 0.88rem; color: var(--muted); border-left: 2px solid var(--accent-2); padding-left: 0.85rem; }

/* ---------- achievements ---------- */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 7.5rem 1.5rem minmax(0, 1fr); gap: 0 1rem; }
.t-date { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); padding-top: 1.35rem; text-align: right; font-variant-numeric: tabular-nums; }
.t-axis { position: relative; }
.t-axis::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
.t-axis::after { content: ""; position: absolute; left: 50%; top: 1.6rem; width: 11px; height: 11px; transform: translate(-50%, 0); border-radius: 50%; background: var(--bg); border: 2px solid var(--accent-2); }
.timeline li.award .t-axis::after { background: var(--accent); border-color: var(--accent); }
.t-body { padding: 1rem 0 1.6rem; display: grid; gap: 0.35rem; }
.t-body h3 { font-size: 1.35rem; }
.t-body p { color: var(--muted); max-width: 62ch; }
.kind { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-2); }
li.award .kind { color: var(--accent); }

.cert { display: block; width: min(320px, 100%); margin: 0.4rem 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: #fff; transition: border-color .2s; }
.cert:hover { border-color: var(--accent); }
.cert img { display: block; width: 100%; height: auto; }
.extra { margin-top: 2.5rem; padding: 1.25rem; border: 1px dashed var(--line); border-radius: var(--radius); display: grid; gap: 0.35rem; }

/* ---------- skills ---------- */
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; }
.skill { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem; display: grid; gap: 0.9rem; align-content: start; }
.skill h3 { font-size: 1.35rem; display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
.skill h3 .label { color: var(--accent-2); }
.skill ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.45rem; }
.skill li { font-size: 0.95rem; padding-bottom: 0.45rem; border-bottom: 1px solid var(--line); }
.skill li:last-child { border-bottom: 0; padding-bottom: 0; }
.skill li small { display: block; color: var(--muted); font-family: var(--font-mono); font-size: 0.72rem; }

/* ---------- contact ---------- */
.contact { display: grid; gap: 1rem; max-width: 640px; }
.contact-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 1.1rem 1.25rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.contact-row .val { font-family: var(--font-mono); font-size: 0.98rem; user-select: all; overflow-wrap: anywhere; min-width: 0; }
.contact-row .label { display: block; margin-bottom: 0.2rem; }


/* ---------- docs, links, 3D, video ---------- */
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.credit { font-size: 0.82rem; color: var(--muted); font-family: var(--font-mono); }
.viewer { margin-top: 2.5rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--media); overflow: hidden; }
.viewer-bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 0.7rem 1rem; border-bottom: 1px solid var(--line); background: var(--surface); }
.viewer model-viewer { display: block; width: 100%; height: clamp(320px, 55vh, 540px); background: transparent; --poster-color: transparent; }
.viewer .hint { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); padding: 0.6rem 1rem; border-top: 1px solid var(--line); }
.journey { margin-top: 3.5rem; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 2rem; align-items: center; }
.journey video { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; display: block; border: 1px solid var(--line); border-radius: var(--radius); background: #000; }
.journey .prose p { color: var(--muted); }
.side-resume { justify-content: center; }
@media (max-width: 1100px) { .journey { grid-template-columns: minmax(0, 1fr); } }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .about-grid, .detail-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .sidebar {
    position: static; width: auto; border-right: 0; border-bottom: 1px solid var(--line);
    padding-block: calc(1.5rem + env(safe-area-inset-top, 0px)) 1rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    gap: 1.1rem; overflow: visible;
  }
  .shell { flex-direction: column; }

  document.querySelectorAll(".nav a").forEach(a => {
    if (a.dataset.route === route) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  const v = $("#view");
  const swap = () => {
    v.innerHTML = html;
    if (route === "work" && !id) renderGrid();
    drawMeshes();
    const mv = $("#mv"); if (mv) loadModel(mv.dataset.first);
    v.classList.remove("leaving");
    if (!firstPaint) window.scrollTo({ top: 0 });

  };
  if (firstPaint || matchMedia("(prefers-reduced-motion: reduce)").matches) swap();
  else { v.classList.add("leaving"); setTimeout(swap, 220); }
}

document.addEventListener("click", e => {

    currentFilter = f.dataset.filter;
    document.querySelectorAll(".filter").forEach(b => b.setAttribute("aria-pressed", String(b === f)));
    renderGrid();
    return;
  }
  const s = e.target.closest("[data-slide]");
  if (s) {
    const t = $("#track");
    t.scrollBy({ left: Number(s.dataset.slide) * t.clientWidth, behavior: "smooth" });
    return;
  }
  const m = e.target.closest("[data-model]");
  if (m) {
    document.querySelectorAll("[data-model]").forEach(b => b.setAttribute("aria-pressed", String(b === m)));
    loadModel(m.dataset.model);
    return;
  }
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const original = cp.textContent, val = cp.closest(".contact-row").querySelector(".val");
    const done = msg => { cp.textContent = msg; setTimeout(() => (cp.textContent = original), 1800); };
    const fallback = () => { selectText(val); done("Selected, press Ctrl+C"); };
    try { navigator.clipboard.writeText(cp.dataset.copy).then(() => done("Copied"), fallback); } catch (_) { fallback(); }
  }
});
document.addEventListener("scroll", e => {

  document.querySelectorAll("#dots i").forEach((d, k) => d.classList.toggle("on", k === i));
}, true);
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

/* ---------- 3D models ----------
   Each model ships as assets/models/<name>.glb.js (base64) for hosts that don't serve .glb;
   if that script is missing, the plain .glb is used. */
const modelCache = {};
function modelURL(path) {
  if (modelCache[path]) return Promise.resolve(modelCache[path]);
  const name = path.split("/").pop().replace(/\.glb$/, "");
  return new Promise(resolve => {
    const sc = document.createElement("script");
    sc.src = path + ".js";
    sc.onload = () => {
      try {
        const b64 = window.__glb[name], bin = atob(b64), bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        delete window.__glb[name];
        resolve(modelCache[path] = URL.createObjectURL(new Blob([bytes], { type: "model/gltf-binary" })));
      } catch (_) { resolve(modelCache[path] = path); }
    };
    sc.onerror = () => resolve(modelCache[path] = path);
    document.head.appendChild(sc);
  });
}
function loadModel(path) {
  const mv = $("#mv"), hint = $("#mv-hint");
  if (!mv) return;
  hint.textContent = "Loading model…";
  modelURL(path).then(url => { if ($("#mv") === mv) mv.setAttribute("src", url); });
  mv.addEventListener("load", () => (hint.textContent = "Drag to rotate · scroll or pinch to zoom"), { once: true });
  mv.addEventListener("error", () => (hint.textContent = "The 3D model couldn't load here. The images above show the same design."), { once: true });
}

/* ---------- drawn mesh placeholder ---------- */
function drawMeshes() {
  document.querySelectorAll("canvas[data-mesh]").forEach(cv => {
    const r = cv.getBoundingClientRect(); if (!r.width) return;
    const dpr = window.devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
    const cs = getComputedStyle(document.documentElement);
    const line = cs.getPropertyValue("--line").trim(), acc = cs.getPropertyValue("--accent-2").trim();
    const w = r.width, h = r.height, cx = w / 2, cy = h / 2;
    ctx.lineWidth = 1;
    // structured O-grid around a body, like a CFD mesh
    for (let k = 1; k <= 9; k++) {
      const rx = 30 + k * k * 2.6, ry = 12 + k * k * 1.3;
      ctx.strokeStyle = k < 3 ? acc : line; ctx.globalAlpha = k < 3 ? 0.7 : 0.9;
      ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.strokeStyle = line; ctx.globalAlpha = 0.9;
    for (let a = 0; a < 36; a++) {
      const t = a / 36 * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(t) * 32, cy + Math.sin(t) * 14); ctx.lineTo(cx + Math.cos(t) * 260, cy + Math.sin(t) * 120); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });
}

/* ---------- theme ---------- */
const themes = ["system", "dark", "light"];
let theme = "system";
try { theme = localStorage.getItem("as-theme") || "system"; } catch (_) {}
function applyTheme() {
  if (theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  $("#theme-btn").textContent = "Theme: " + theme;
  drawMeshes();
}
$("#theme-btn").addEventListener("click", () => {
  theme = themes[(themes.indexOf(theme) + 1) % themes.length];
  try { localStorage.setItem("as-theme", theme); } catch (_) {}
  applyTheme();
});
